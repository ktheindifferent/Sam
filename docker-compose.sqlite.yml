version: "3.9"

services:
  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: sam-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sam-network
    profiles:
      - with-redis

  # S.A.M. Application with SQLite (default)
  sam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam-app
    environment:
      DATABASE_ENGINE: sqlite
      SQLITE_PATH: /var/lib/sam/data/sam.db
      REDIS_URL: ${REDIS_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: 1
      RUN_MIGRATIONS: "true"
      SAM_HTTP_PORT: 8000
      SAM_HTTPS_PORT: 8443
    volumes:
      - sam_data:/var/lib/sam
      - sam_logs:/var/log/sam
      - ./config:/opt/sam/config
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sam-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: sam-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - sam
    networks:
      - sam-network
    restart: unless-stopped
    profiles:
      - production

  # PostgreSQL Database (optional - use when you want to switch from SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: sam-postgres
    environment:
      POSTGRES_DB: sam_db
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sam_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sam-network
    profiles:
      - with-postgres

  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: sam-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - sam-network
    profiles:
      - monitoring

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: sam-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - sam-network
    profiles:
      - monitoring

networks:
  sam-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  sam_data:
  sam_logs:
  prometheus_data:
  grafana_data: