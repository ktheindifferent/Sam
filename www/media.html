              <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>.

          </video>

          <!-- Audio Player -->
          <div id="nextcloudAudioPlayer" style="display: none; padding: 40px; text-align: center;">
            <div class="audio-player-info" style="margin-bottom: 20px;">
              <h4 id="audioTitle" style="color: white; margin-bottom: 10px;"></h4>

            </div>
            <audio controls style="width: 100%; max-width: 500px;">

            </audio>
          </div>

            <img id="viewerImage" src="" style="max-width: 100%; max-height: 70vh; border-radius: 8px;">

              <h5 id="imageTitle" style="color: white;"></h5>
              <p id="imageDetails"></p>
            </div>
          </div>

          <!-- Document Viewer -->
          <div id="nextcloudDocumentViewer" style="display: none; padding: 20px; text-align: center;">
            <div class="document-info" style="margin-bottom: 20px;">
              <h4 id="documentTitle" style="color: white;"></h4>

              <button class="btn btn-info controller-btn" onclick="openInNewTab()">

              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-top: 1px solid #27a0b9;">

  <script src="/assets/js/seaweedfs-media.js"></script>
  
  <!-- Media center mobile controls -->
  <div class="media-center-mobile-controls" id="media-center-mobile-controls">
    <button class="media-center-mobile-btn" onclick="previousTrack()" title="Previous">
      <i class="fas fa-step-backward"></i>
    </button>
    <button class="media-center-mobile-btn play-pause" onclick="togglePlayPause()" title="Play/Pause">
      <i class="fas fa-play" id="mobile-play-icon"></i>
    </button>
    <button class="media-center-mobile-btn" onclick="nextTrack()" title="Next">
      <i class="fas fa-step-forward"></i>
    </button>
    <button class="media-center-mobile-btn" id="ambient-light-btn" onclick="toggleAmbientLight()" title="Ambient Light">
      <i class="fas fa-lightbulb"></i>
    </button>
    <button class="media-center-mobile-btn" id="voice-command-btn" onclick="startVoiceCommand()" title="Voice Command">
      <i class="fas fa-microphone"></i>
    </button>
    <button class="media-center-mobile-btn" id="crossfade-btn" onclick="toggleCrossfade()" title="Crossfade">
      <i class="fas fa-random"></i>
    </button>
  </div>
  
  <!-- LIFX undo button for gesture history -->
  <div class="lifx-undo-btn" id="lifx-undo-btn" onclick="LifXTouchControls.undoLastGesture()" title="Undo Last Gesture">
    <i class="fas fa-undo"></i>
  </div>
  
  <!-- Multi-bulb selection toolbar -->
  <div class="lifx-selection-toolbar" id="lifx-selection-toolbar">
    <span class="lifx-selection-count" id="lifx-selection-count">0 selected</span>
    <button class="btn btn-sm btn-primary" onclick="LifXTouchControls.powerAll('on')">
      <i class="fas fa-power-on"></i> All On
    </button>
    <button class="btn btn-sm btn-danger" onclick="LifXTouchControls.powerAll('off')">
      <i class="fas fa-power-off"></i> All Off
    </button>
    <button class="btn btn-sm btn-warning" onclick="LifXTouchControls.clearMultiSelection()">
      <i class="fas fa-times"></i> Clear
    </button>
  </div>
  
  <!-- Touch hold progress indicator -->
  <div class="touch-hold-progress" id="touch-hold-progress"></div>
</body>

</html>
