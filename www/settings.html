<body class=" ">
  <div class="wrapper ">
    <!-- SIDEBAR - DYNAMICALLY POPULATED -->
    <div class="sidebar" id="sidebar">
      
    </div>
    <div class="main-panel">
      <!-- NAVBAR - DYNAMICALLY POPULATED -->
      <nav class="navbar navbar-expand-lg navbar-absolute navbar-transparent" id="navbar">

      </nav>
     
   


      <div class="content">
        <div class="row" id="locations_table_body">
       
       
          <!-- Global Settings -->
          <div class="col-md-8">
              <div class="card ">
                  <div class="card-header">
                      <h4 class="card-title" style="text-align: center;"><i class="fas fa-globe float-left"></i><span>Global Settings</span></h4>
                  </div>
                  <div class="card-body">
                    <table id="settings_table" class="table" style="color: white;">
         
                    </table>
                  </div>
              </div>
          </div>
      
          <!-- Storage Locations -->
          <div class="col-md-4">
            <div class="card ">
                <div class="card-header">
                    <h4 class="card-title" style="text-align: center;"><i class="fas fa-layer-group float-left"></i><span>Storage Providers</span></h4>
                </div>
                <div class="card-body">
                  <!-- Default Storage Provider Selection -->
                  <div class="form-group">
                    <label for="defaultStorageProvider" class="form-label">Default Storage Provider</label>
                    <select class="form-control" id="defaultStorageProvider">
                      <option value="sam">SAM (Local)</option>
                      <option value="nextcloud">NextCloud</option>
                      <option value="dropbox">Dropbox</option>
                      <option value="seaweedfs">SeaweedFS</option>
                    </select>
                  </div>

                  <!-- Storage Provider Configurations -->
                  <div class="mt-4">
                    <h6><i class="fas fa-cog"></i> Provider Configurations</h6>

                    <!-- NextCloud Configuration -->
                    <div class="storage-config" id="nextcloud-config" style="display: none;">
                      <h7>NextCloud</h7>
                      <div class="form-group mt-2">
                        <input type="url" class="form-control form-control-sm" id="nextcloudServerUrl" placeholder="Server URL">
                      </div>
                      <div class="row">
                        <div class="col-6">
                          <input type="text" class="form-control form-control-sm" id="nextcloudUsername" placeholder="Username">
                        </div>
                        <div class="col-6">
                          <input type="password" class="form-control form-control-sm" id="nextcloudPassword" placeholder="Password">
                        </div>
                      </div>
                      <button class="btn btn-sm btn-info mt-2 controller-btn" onclick="testStorageConnection('nextcloud')">
                        <i class="fas fa-plug"></i> Test Connection
                      </button>
                    </div>

                    <!-- Dropbox Configuration -->
                    <div class="storage-config" id="dropbox-config" style="display: none;">
                      <h7>Dropbox</h7>
                      <div class="form-group mt-2">
                        <input type="text" class="form-control form-control-sm" id="dropboxAccessToken" placeholder="Access Token">
                      </div>
                      <button class="btn btn-sm btn-info mt-2 controller-btn" onclick="testStorageConnection('dropbox')">
                        <i class="fas fa-plug"></i> Test Connection
                      </button>
                      <button class="btn btn-sm btn-success mt-2 controller-btn" onclick="authenticateDropbox()">
                        <i class="fab fa-dropbox"></i> Authenticate
                      </button>
                    </div>

                    <!-- SeaweedFS Configuration -->
                    <div class="storage-config" id="seaweedfs-config" style="display: none;">
                      <h7>SeaweedFS</h7>
                      <div class="form-group mt-2">
                        <input type="url" class="form-control form-control-sm" id="seaweedMasterUrl" placeholder="Master URL (e.g., http://localhost:9333)">
                      </div>
                      <div class="form-group mt-1">
                        <input type="url" class="form-control form-control-sm" id="seaweedFilerUrl" placeholder="Filer URL (e.g., http://localhost:8888)">
                      </div>
                      <div class="row mt-1">
                        <div class="col-6">
                          <input type="text" class="form-control form-control-sm" id="seaweedCollection" placeholder="Collection">
                        </div>
                        <div class="col-6">
                          <input type="text" class="form-control form-control-sm" id="seaweedReplication" placeholder="Replication">
                        </div>
                      </div>
                      <button class="btn btn-sm btn-info mt-2 controller-btn" onclick="testStorageConnection('seaweedfs')">
                        <i class="fas fa-plug"></i> Test Connection
                      </button>
                    </div>

                    <!-- SAM Local Storage -->
                    <div class="storage-config" id="sam-config" style="display: none;">
                      <h7>SAM Local Storage</h7>
                      <div class="form-group mt-2">
                        <input type="text" class="form-control form-control-sm" id="samStoragePath" placeholder="Storage Path" value="/var/sam/storage">
                      </div>
                      <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="samEnableEncryption">
                        <label class="form-check-label" for="samEnableEncryption">Enable Encryption</label>
                      </div>
                      <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="samEnableCompression">
                        <label class="form-check-label" for="samEnableCompression">Enable Compression</label>
                      </div>
                    </div>
                  </div>

                  <!-- Save Configuration -->
                  <div class="mt-4">
                    <button class="btn btn-success controller-btn" onclick="saveStorageSettings()">
                      <i class="fas fa-save"></i> Save Settings
                    </button>
                  </div>
                </div>
            </div>
          </div>
  
        
        </div>
      </div>

      <div class="bg-animation">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
        <div id="stars4"></div>
      </div>

      </div>
    </div>

    <!--   Core JS Files   -->
    <script src="/assets/js/vendor/jquery.min.js"></script>

    <script src="/assets/js/vendor/bootstrap.min.js"></script>
<script src="/assets/js/vendor/toastr.min.js"></script>

  <script src="/assets/js/widgets/notifications.js"></script>
    <script src="/assets/js/core.js"></script>
<script src="/assets/js/widgets/search.js"></script>
<script src="/assets/js/widgets/oss.js"></script>
<script src="/assets/js/apps/video_player.js"></script>
    <script src="/assets/js/settings.js"></script>

</body>

</html>
