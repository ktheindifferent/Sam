<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>
    Sam
  </title>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />

  <!-- CSS Files -->
  <link href="/assets/vendor/fontawesome/css/all.css" rel="stylesheet">
  <link href="/assets/vendor/fontawesome/css/solid.css" rel="stylesheet">
  <link href="/assets/fonts/press_start/press_start.css" rel="stylesheet" type="text/css">
  <link href="/assets/css/vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/vendor/toastr.min.css" rel="stylesheet" />
  <link href="/assets/css/vendor/black-dashboard.min.css?v=1.0.0" rel="stylesheet" />
  <link href="/assets/css/core.css" rel="stylesheet" />
  <link href="/assets/css/enhanced-dashboard.css" rel="stylesheet" />
  <script src="/assets/js/ui.js"></script>
</head>

<body class=" ">
  <div class="wrapper ">
    <!-- SIDEBAR - DYNAMICALLY POPULATED -->
    <div class="sidebar" id="sidebar">

    </div>
    <div class="main-panel">
      <!-- NAVBAR - DYNAMICALLY POPULATED -->
      <nav class="navbar navbar-expand-lg navbar-absolute navbar-transparent" id="navbar">

      </nav>
    
  
      <div class="content">
        <!-- Enhanced Home Dashboard -->
        <div class="row">
          <!-- Quick Stats Cards -->
          <div class="col-xl-3 col-lg-6 col-md-6">
            <div class="card card-stats">
              <div class="card-body">
                <div class="row">
                  <div class="col-5 col-md-4">
                    <div class="icon-big text-center icon-warning">
                      <i class="fas fa-cogs text-primary"></i>
                    </div>
                  </div>
                  <div class="col-7 col-md-8">
                    <div class="numbers">
                      <p class="card-category">Services</p>
                      <p class="card-title" id="services-count">8</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-footer">
                <hr>
                <div class="stats">
                  <i class="fas fa-check text-success"></i> 6 Running
                </div>
              </div>
            </div>
          </div>

          <div class="col-xl-3 col-lg-6 col-md-6">
            <div class="card card-stats">
              <div class="card-body">
                <div class="row">
                  <div class="col-5 col-md-4">
                    <div class="icon-big text-center icon-warning">
                      <i class="fas fa-database text-success"></i>
                    </div>
                  </div>
                  <div class="col-7 col-md-8">
                    <div class="numbers">
                      <p class="card-category">Database</p>
                      <p class="card-title" id="db-tables-count">24</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-footer">
                <hr>
                <div class="stats">
                  <i class="fas fa-link text-info"></i> Connected
                </div>
              </div>
            </div>
          </div>

          <div class="col-xl-3 col-lg-6 col-md-6">
            <div class="card card-stats">
              <div class="card-body">
                <div class="row">
                  <div class="col-5 col-md-4">
                    <div class="icon-big text-center icon-warning">
                      <i class="fas fa-microchip text-warning"></i>
                    </div>
                  </div>
                  <div class="col-7 col-md-8">
                    <div class="numbers">
                      <p class="card-category">CPU Usage</p>
                      <p class="card-title" id="cpu-usage-card">0%</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-footer">
                <hr>
                <div class="stats">
                  <i class="fas fa-tachometer-alt text-primary"></i> Real-time
                </div>
              </div>
            </div>
          </div>

          <div class="col-xl-3 col-lg-6 col-md-6">
            <div class="card card-stats">
              <div class="card-body">
                <div class="row">
                  <div class="col-5 col-md-4">
                    <div class="icon-big text-center icon-warning">
                      <i class="fas fa-memory text-danger"></i>
                    </div>
                  </div>
                  <div class="col-7 col-md-8">
                    <div class="numbers">
                      <p class="card-category">Memory</p>
                      <p class="card-title" id="memory-usage-card">0 MB</p>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-footer">
                <hr>
                <div class="stats">
                  <i class="fas fa-chart-bar text-info"></i> Active
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Quick Actions</h4>
                <p class="card-category">Manage your S.A.M. instance</p>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-lg-3 col-md-6 mb-3">
                    <button class="btn btn-primary btn-block" onclick="location.href='/dashboard.html'">
                      <i class="fas fa-tachometer-alt"></i> Full Dashboard
                    </button>
                  </div>
                  <div class="col-lg-3 col-md-6 mb-3">
                    <button class="btn btn-success btn-block" onclick="location.href='/services.html'">
                      <i class="fas fa-cogs"></i> Manage Services
                    </button>
                  </div>
                  <div class="col-lg-3 col-md-6 mb-3">
                    <button class="btn btn-info btn-block" onclick="location.href='/settings.html'">
                      <i class="fas fa-wrench"></i> Settings
                    </button>
                  </div>
                  <div class="col-lg-3 col-md-6 mb-3">
                    <button class="btn btn-warning btn-block" onclick="openConsole()">
                      <i class="fas fa-terminal"></i> Terminal
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- System Status Overview -->
        <div class="row">
          <div class="col-lg-8">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">System Overview</h4>
                <p class="card-category">Real-time system monitoring</p>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-4 text-center">
                    <div class="progress-container">
                      <div class="progress-badge">
                        <span class="progress-value">CPU</span>
                      </div>
                      <div class="progress">
                        <div class="progress-bar bg-primary" id="cpu-progress-main" style="width: 0%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-4 text-center">
                    <div class="progress-container">
                      <div class="progress-badge">
                        <span class="progress-value">Memory</span>
                      </div>
                      <div class="progress">
                        <div class="progress-bar bg-success" id="memory-progress-main" style="width: 0%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-4 text-center">
                    <div class="progress-container">
                      <div class="progress-badge">
                        <span class="progress-value">Disk</span>
                      </div>
                      <div class="progress">
                        <div class="progress-bar bg-warning" id="disk-progress-main" style="width: 0%"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Recent Activities</h4>
                <p class="card-category">Last 5 system events</p>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table tablesorter">
                    <tbody id="recent-activities">
                      <tr>
                        <td>
                          <div class="d-flex">
                            <i class="fas fa-check-circle text-success mr-2"></i>
                            <span>System started</span>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
  
      </div>



      <div class="bg-animation">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
        <div id="stars4"></div>
      </div>



      </div>
    </div>

    <!--   Core JS Files   -->
    <script src="/assets/js/vendor/jquery.min.js"></script>

    <script src="/assets/js/vendor/bootstrap.min.js"></script>
<script src="/assets/js/vendor/toastr.min.js"></script>

    <!--  Notifications Plugin    -->
    <script src="/assets/js/vendor/bootstrap-notify.js"></script>
    <!-- <script src="/assets/js/vendor/recorder.js"></script>
    <script src="/assets/js/services/stt.js"></script> -->
    <script src="/assets/js/widgets/observation_deck.js"></script>
    <script src="/assets/js/widgets/files.js"></script>
    <script src="/assets/js/widgets/clock.js"></script>
    <script src="/assets/js/widgets/notifications.js"></script>
    <script src="/assets/js/widgets/search.js"></script>
    <script src="/assets/js/widgets/oss.js"></script>
    <script src="/assets/js/apps/video_player.js"></script>
    <script src="/assets/js/core.js"></script>



</body>

</html>
