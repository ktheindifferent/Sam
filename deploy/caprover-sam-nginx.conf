<%
if (s.forceSsl) {
%>
server {
    listen 80;
    server_name <%-s.publicDomain%>;

    location /.well-known/acme-challenge/ {
        root <%-s.staticWebRoot%>;
    }

    location /.well-known/captain-identifier {
        root <%-s.staticWebRoot%>;
    }

    location / {
        return 302 https://$http_host$request_uri;
    }
}
<%
}
%>

server {
    <%
    if (!s.forceSsl) {
    %>
    listen 80;
    <%
    }
    if (s.hasSsl) {
    %>
    listen 443 ssl;
    http2 on;
    ssl_certificate <%-s.crtPath%>;
    ssl_certificate_key <%-s.keyPath%>;
    <%
    }
    if (s.logAccessPath) {
    %>
    access_log <%-s.logAccessPath%>;
    <%
    }
    %>

    client_max_body_size 500m;
    server_name <%-s.publicDomain%>;
    resolver 127.0.0.11 valid=10s;

    set $http_upstream http://<%-s.localDomain%>:<%-s.containerHttpPort%>;
    set $ws_upstream http://<%-s.localDomain%>:8080;

    location /ws {
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location / {
        <%
        if (s.redirectToPath) {
        %>
        return 302 <%-s.redirectToPath%>$request_uri;
        <%
        } else {
        %>
        <%
        if (s.httpBasicAuthPath) {
        %>
        auth_basic "Restricted Access";
        auth_basic_user_file <%-s.httpBasicAuthPath%>;
        <%
        }
        %>
        proxy_pass $http_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        <%
        }
        %>
    }

    location /.well-known/acme-challenge/ {
        root <%-s.staticWebRoot%>;
    }

    location /.well-known/captain-identifier {
        root <%-s.staticWebRoot%>;
    }

    error_page 502 /captain_502_custom_error_page.html;
    location = /captain_502_custom_error_page.html {
        root <%-s.customErrorPagesDirectory%>;
        internal;
    }
}
